name = "simpletool-app"
main = "src/worker.js"
compatibility_date = "2024-10-25"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "dist"
binding = "ASSETS"

[version_metadata]
binding = "CF_VERSION_METADATA"

[vars]
ENVIRONMENT = "production"
SITE_URL = "https://simpletool.app"
# Ads stay off until real slot IDs exist. ads.txt is served only then.
# Create three Display units in AdSense (NPA, no Auto ads) and paste the IDs:
#   home  = homepage below the tool grid
#   json  = JSON Formatter below the editor
#   legal = changelog / about / privacy / terms / contact / security / careers
ADSENSE_CLIENT = "ca-pub-5134881365131182"
# ADSENSE_SLOTS = "{\"home\":\"1111111111\",\"json\":\"2222222222\",\"legal\":\"3333333333\"}"
ADSENSE_SLOTS = "{}"
SENTRY_DSN = ""
CF_ANALYTICS_TOKEN = ""

# Note: Custom domain will be configured via Cloudflare Dashboard after deployment
# Dashboard: Workers & Pages → simpletool-app → Settings → Triggers → Custom Domains
# Add: simpletool.app

[durable_objects]
bindings = [{ name = "RATE_LIMITER", class_name = "RateLimiter" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

[observability.logs]
enabled = true
invocation_logs = true
